[project]
name = "shamba"
version = "0.2.2"
description = "Offline crop-disease diagnosis and treatment advice for smallholder farmers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Biniyam Gashaw" }]
keywords = ["computer-vision", "agriculture", "africa", "crop-disease", "onnx", "edge-ai", "food-security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "onnxruntime>=1.19",
  "pillow>=10.4",
  "numpy>=1.26",
  "typer>=0.12",
  "rich>=13.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.9",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx2"]
llm = ["httpx>=0.27"]

[project.scripts]
shamba = "shamba.cli:app"

[project.urls]
Homepage = "https://github.com/iambiniyam/shamba"
Repository = "https://github.com/iambiniyam/shamba"
Issues = "https://github.com/iambiniyam/shamba/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shamba"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]
